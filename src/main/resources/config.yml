# CoreTools configuration
# Prices are in your Vault economy's currency. The values below are placeholders:
# tune them against how fast players earn money on your server.

# Percentage taken from every head sale (money sink). 0 disables it.
sale-tax-percent: 0

# Extra drop chance per Looting level (0.01 = +1% per level).
looting-bonus-per-level: 0.01

# Tell the killer when a head drops.
notify-on-drop: true

# Worlds where heads never drop.
disabled-worlds: []

# Mobs spawned for these reasons never drop heads (anti-farm).
# Full list: https://jd.papermc.io/paper/1.21.11/org/bukkit/event/entity/CreatureSpawnEvent.SpawnReason.html
blocked-spawn-reasons:
  - SPAWNER
  - TRIAL_SPAWNER
  - SPAWNER_EGG
  - BREEDING
  - DISPENSE_EGG
  - EGG
  - SLIME_SPLIT
  - BUILD_IRONGOLEM
  - BUILD_SNOWMAN
  - BUILD_WITHER

# Seconds between uses (self-use only). Players with coretools.cooldown.bypass ignore these.
cooldowns:
  heal: 300
  feed: 120

# Saturation applied by /feed (max 20).
feed-saturation: 20.0

# Heads. Key = Minecraft entity ID (lowercase). Any entity ID works; add your own.
#   chance:  drop probability, 0.05 = 5%
#   price:   sale value per head
#   texture: (optional) base64 skin texture value for a custom-looking head.
#            Vanilla heads are used automatically for zombie, skeleton, wither_skeleton,
#            creeper, piglin and ender_dragon. Everything else is a plain player head
#            unless you paste a texture value here.
mobs:
  zombie:
    chance: 0.05
    price: 15.0
  skeleton:
    chance: 0.05
    price: 15.0
  creeper:
    chance: 0.05
    price: 25.0
  spider:
    chance: 0.05
    price: 15.0
  enderman:
    chance: 0.03
    price: 50.0
  witch:
    chance: 0.05
    price: 40.0
  blaze:
    chance: 0.05
    price: 40.0
  wither_skeleton:
    chance: 0.03
    price: 75.0
  cow:
    chance: 0.05
    price: 8.0
  pig:
    chance: 0.05
    price: 8.0
  sheep:
    chance: 0.05
    price: 8.0
  chicken:
    chance: 0.05
    price: 6.0

messages:
  prefix: "<dark_gray>[<gold>CoreTools</gold>]</dark_gray> "
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this command."
  player-not-found: "<red>Player not found."
  no-economy: "<red>No economy is available right now. Tell an admin."
  usage-heal: "<red>Usage: /heal [player]"
  usage-feed: "<red>Usage: /feed [player]"
  usage-coretools: "<red>Usage: /coretools reload"
  cooldown: "<red>Wait <seconds>s before using that again."
  healed: "<green>You were healed."
  healed-other: "<green>You healed <player>."
  fed: "<green>Your hunger was restored."
  fed-other: "<green>You fed <player>."
  head-dropped: "<yellow>A <head> dropped!"
  no-heads: "<red>You have no sellable heads."
  sold: "<green>Sold <count> head(s) for <gold><amount></gold>."
  sale-failed: "<red>The sale failed. Your heads were returned."
  reloaded: "<green>Config reloaded."
